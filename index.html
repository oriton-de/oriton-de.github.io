<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ORITON | Altamira Guitars</title>

  <meta
    name="description"
    content="ORITON – Authorized Distributor for DACH and Benelux. Stuttgart, Germany."
  >

  <style>

    /* ========================================
       基础设置
    ======================================== */

    :root {
      --cream: #f3ead8;
      --ink: #24170f;
      --gold: #a77a3e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }


    /* ========================================
       顶部导航
    ======================================== */

    .nav {
      position: fixed;

      top: 0;
      left: 0;

      z-index: 1000;

      width: 100%;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;

      background: rgba(243, 234, 216, 0.96);

      border-bottom: 1px solid rgba(36, 23, 15, 0.12);

      backdrop-filter: blur(8px);
    }


    .logo {
      font-size: 20px;

      letter-spacing: 5px;

      color: var(--ink);

      text-decoration: none;
    }


    .nav-links {
      display: flex;

      gap: 30px;

      font-size: 12px;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .nav-links a {
      color: var(--ink);

      text-decoration: none;

      transition: color 0.2s ease;
    }


    .nav-links a:hover {
      color: var(--gold);
    }


    /* ========================================
       名片区域
    ======================================== */

    .cards {

      padding-top: 64px;

      width: 100%;

    }


    .card-section {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      background: var(--cream);

      overflow: hidden;

      line-height: 0;

    }


    /*
       两张名片使用完全相同的尺寸规则
    */

    .card-image {

      display: block;

      width: 100%;

      max-width: 1000px;

      height: auto;

      object-fit: contain;

      /*
         去除 PNG 最外侧的细黑边
      */

      clip-path: inset(8px);

      user-select: none;

      -webkit-user-drag: none;

    }


    /*
       正面和背面之间只留一点空间
    */

    .card-section + .card-section {

      padding-top: 18px;

    }


    /* ========================================
       手机 / 平板
    ======================================== */

    @media (max-width: 700px) {

      .nav {

        height: 56px;

        padding: 0 20px;

      }


      .logo {

        font-size: 16px;

        letter-spacing: 4px;

      }


      .nav-links {

        gap: 12px;

        font-size: 9px;

        letter-spacing: 1px;

      }


      .cards {

        padding-top: 56px;

      }


      .card-image {

        width: 100%;

        clip-path: inset(2px);

      }


      .card-section + .card-section {

        padding-top: 8px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       顶部导航
  ====================================== -->

  <header class="nav">

    <a
      class="logo"
      href="#top"
    >
      ORITON
    </a>


    <nav class="nav-links">

      <a href="#front">
        Über uns
      </a>

      <a
  href="https://altamiraguitars.com/"
  target="_blank"
  rel="noopener noreferrer"
>
  Altamira
</a>

      <a href="#back">
        Kontakt
      </a>

    </nav>

  </header>



  <!-- =====================================
       两张名片
  ====================================== -->

  <main
    class="cards"
    id="top"
  >


    <!-- ===================================
         名片正面
    ==================================== -->

    <section
      class="card-section"
      id="front"
    >

      <img
        class="card-image"
        src="oriton-card-front.png"
        alt="ORITON – When Origin Finds Its Sound – Altamira Authorized Distributor"
      >

    </section>



    <!-- ===================================
         名片背面
    ==================================== -->

    <section
      class="card-section"
      id="back"
    >

      <img
        class="card-image"
        src="oriton-card-back.png"
        alt="ORITON – Lady Jin – Founder – Contact"
      >

    </section>


  </main>


</body>

</html>
